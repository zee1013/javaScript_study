<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수 예제 1</title>
</head>
<body>
    <button onclick="sayHi()">click!</button>
    <script>
        function sayHi(){
            console.log("안녕!");
        }
        sayHi()

        function greet(userName){
            document.write(`${userName}님 안녕하세용`)
        }
        greet("배은지")
    </script>
</body>
</html>
