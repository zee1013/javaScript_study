<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수 예제 9 - todo 리스트</title>
    <style>
        li{
            list-style: none;
        }
        .todo{
            margin: 10px 0;
            cursor: pointer;
        }
        .completed{
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>
    <h2>🧸 오늘 할 일 🧸</h2>
    <ul>
        <li class="todo"><input type="checkbox"> 청소하기</input></li>
        <li class="todo"><input type="checkbox"> 장보기</input></li>
        <li class="todo"><input type="checkbox"> 운동하기</input></li>
        <li class="todo"><input type="checkbox"> 공부하기</input></li>
    </ul>
    <script>
        const todos = document.querySelectorAll(".todo")
        todos.forEach(function(todo){
            // console.log(todo);
            const checkBox = todo.querySelector("input")
            // console.log(checkBox);
            checkBox.addEventListener("change", function(){
                console.log(checkBox.checked);
                
                if(checkBox.checked){
                    todo.classList.add("completed")
                }else{
                    todo.classList.remove("completed")
                }
            })
        })
    </script>
</body>
</html>
