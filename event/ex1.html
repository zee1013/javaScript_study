<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            width: 100px;
            height: 100px;
            background-color: rgb(69, 69, 105);
        }
        #box.active{
            background-color: blue;
        }
    </style>
</head>
<body>
    <!-- 1. 이벤트 연결 -->
     <button id="btn">눌러보세요</button>
     <!-- 2. 입력 이벤트 -->
      <input type="text" id="username" placeholder="이름을 입력하세요">
      <!-- 3. form 제출 이벤트 -->
       <form id="myForm">
        <input type="text" placeholder="email 입력하세요">
        <button type="submit">제출</button>
       </form>
       <!-- 4. 마우스 이벤트 -->
        <div id="box"></div>
       <!-- 5. 키보드 이벤트 -->
        <input type="text" id="keyInput" placeholder="아무 키나 눌러보세요">
     <script>
        // 1. 이벤트 연결
        const btn = document.querySelector("#btn")
        btn.addEventListener("click", ()=>{
            console.log("click");
            
        })
        // 2. 입력 이벤트
        const username = document.querySelector("#username")
        username.addEventListener("input", function(){
            console.log("입력 값 :" , username.value);
            
        })
        // 3. form 제출 이벤트
        const form = document.querySelector("#myForm")
        form.addEventListener("submit" , (e)=>{
            console.log(e);
            e.preventDefault()
            console.log("폼이 제출 되었습니다");
            
        })
        // 4. 마우스 이벤트
        const box = document.querySelector("#box")
        box.addEventListener("mouseover" , function(){
            box.style.backgroundColor = "pink"
        })
        box.addEventListener("mouseout",()=>{
            box.style.backgroundColor = "rgb(69, 69, 105)"
        })
        // 5. 키보드 이벤트
        const key = document.querySelector("#keyInput")
        key.addEventListener("keydown", (e)=>{
            console.log(e);
            
            console.log(e.key);
            
        })
        // 6. 페이지 로드 이벤트
        window.addEventListener("load",function(){
            console.log("페이지 로딩 완료");
            
        })
        // 7. 리사이즈 이벤트
        window.addEventListener("resize", ()=>{
            if(window.innerWidth < 600){
                box.classList.add("active")
            }else{
                box.classList.remove("active")
            }
        })
     </script>
</body>
</html>
