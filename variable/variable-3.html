<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수 - 3</title>
    <style>
        span{
            color: blue;
        }
    </style>
</head>
<body>
    
    <script>
        let banana = 2000
        let apple = 1500
        let mango = 4000
        let bananaCount = 3
        let appleCount = 2
        let mangoCount = 4
        let total = (banana*bananaCount)+(apple*appleCount)+(mango*mangoCount)
        document.write(`<p>바나나, 사과, 망고를 다 더한 금액은 <span>${total}</span>원 입니다.</p>`)
    </script>
</body>
</html>
