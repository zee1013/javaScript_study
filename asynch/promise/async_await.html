<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        ul,li,a{
            list-style: none;
            text-decoration: none;
            color: #222;
        }
        img{
            display: block;
            width: 100%;
            height: 250px;
            object-fit: contain;
        }
        #list{
            /* width: 1200px; */
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        #list li{
            border: 1px solid #eee;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #list li h3{
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>상품리스트</h1>
    <ul id="list"></ul>

    <script>
        // async = 이 함수 안에서 기다릴 수 있어~~
        // await = 결과 나올때 까지 기다려!
        // try / catch = 성공하면 try, 실패하면 catch
        // finally = 무조건 마지막에 실행
        async function getProducts(params) {
            try{
                const res = await fetch("https://fakestoreapi.com/products?limit=8")
                const data = await res.json()
                const ulE = document.querySelector("#list")
                data.forEach((item)=>{
                   ulE.innerHTML += `
                   <li>
                    <img src="${item.image}" alt="${item.category}">
                    <h3>${item.title}</h3>
                    <p>${item.price}</p>
                    <p>${item.description}</p>
                    <p>평점 : ${item.rating.rate}</p>
                    <p>구매수 : ${item.rating.count}</p>
                    </li>
                   `
                })
            }
            catch(e){console.log("에러 : ", e);
            }finally{
                console.log("데이터 불러오기 완료!");
                
            }
        }getProducts()
    </script>
</body>
</html>
