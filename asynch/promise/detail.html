<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고야잉 디테일 페이지🐾</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        ul,li,a{
            list-style: none;
            text-decoration: none;
            color: #222;
        }
        .container {
        width: 800px;
        margin: 50px auto;
      }

      img {
        width: 100%;
        max-width: 500px;
      }

      .info {
        margin-top: 20px;
      }

      .info p {
        margin: 10px 0;
      }
    </style>
    </style>
</head>
<body>
    <div id="detail"></div>

    <script>
        // URL 파라미터 받기
        // 현재 URL의 쿼리스트링(?id=1)을 가져옴
        const parms = new URLSearchParams(location.search)
        // id 추출
        // 문자열로 가져오므로 Number()를 이용해 숫자로 변환
        const id = Number(parms.get("id"))
        async function getDetail() {
            try{
                const res = await fetch("cats.json")
                const cats = await res.json()
                // 파라미터로 받아온 id 랑 json에 있는 id랑 같은 요소를 찾는다
                const cat = cats.find((item)=>item.id === id)
                const detail = document.querySelector("#detail")

                // 존재하지 않는 id 처리 혹은 받아온 id가 없을 경우
                if(!cat){
                    detail.innerHTML = `
                    <h2>고양이 정보를 찾을 수 없습니다.</h2>
                    <a href="cat.html">고양이 목록으로 돌아가기</a>
                    `
                    return
                }detail.innerHTML = `
                <div class="container">
        <img src="${cat.image}" alt="${cat.name}">
        <div class="info">
        <h1>${cat.name}</h1>
        <p><strong></strong>${cat.origin}</p>
        <p><strong>성격 : </strong>${cat.temperament}</p>
        <p><strong>평균 수명 :</strong>${cat.life_span}</p>
        <p><strong>지능 : </strong>${cat.intelligence}</p>
        <p><strong>친화력 : </strong>${cat.affection_level}</p>
        <p><strong>설명 : </strong>${cat.description}</p>
    </div>
    <p><a href="cat.html">목록으로 돌아가기 →</a></p>
</div>
                `

            }
            catch(e){
                console.log(e);
                
            }
        }getDetail()
    </script>
</body>
</html>
