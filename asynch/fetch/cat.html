<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        ul, li, a{
            list-style: none;
            text-decoration: none;
            color: #333;
        }
        img{
            display: block;
            width: 100%;
            object-fit: cover;
        }
        #catlist{
            display: flex;
            gap: 10px;
            margin: 50px auto;
            width: 1000px;
            justify-content: space-between;

        }
        .cat-card{
            flex: 1;
                        border-radius: 20px;
            overflow: hidden;
            margin-bottom: 10px;
            padding: 20px;
            background-color: rgb(198, 219, 228);
        }
        .cat-img{
            border-radius: 20px;
            height: 300px;
        }
        .pagenation{
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .pagenation a{
            padding: 10px 15px;
            border-radius: 50px;
            font-weight: bold;
            color: rgb(68, 53, 36);
            background-color: rgb(240, 233, 156);
        }
        .pagenation a.active{
            color: #fff;
            background-color: rgb(99, 158, 247);
        }
        .page-link.disabled{
            color: #707253;
            background-color: #e2e2ca;
        }
    </style>
  </head>
  <body>
    <div id="catlist">
      <!-- js 출력 -->
    </div>
    <!-- 페이지네이션 -->
    <div class="pagenation" id="pagenation">
      <!-- js 출력 -->
    </div>

    <script>
      // 화면에 몇 개 보여질건지 설정, 현재 페이지는 1페이지로 시작
      const itemsPerPage = 3;
      let currentPage = 1;
      const catListDiv = document.querySelector("#catlist");
      const pagenationDiv = document.querySelector("#pagenation");
      const prevBtn = document.createElement("a");
      const nextBtn = document.createElement("a");

      // 고양이 정보를 가져와서 화면에 출력하는 함수
      function displayCatInfo(page) {
        // console.log(page); // 1이 담겨있음
        fetch("cat.json")
          .then((response) => response.json())
          .then((data) => {
             // ✅ 페이지 이동 시 카드 초기화
            catListDiv.innerHTML = "";
            
            // 페이지네이션 계산
            // 처음 보여지는 인덱스 번호
            const startIndex = (page - 1) * itemsPerPage; 
            // 마지막 인덱스 번호
            const endIndex = startIndex + itemsPerPage
            
            // startIndex ~ endIndex 범위의 데이터만 잘라서 카드로 출력
            const catsOnPage = data.slice(startIndex, endIndex) // 0,1,2
            catsOnPage.forEach((cat)=>{
                // console.log(cat);
                // 카드 생성 후 catListDiv에 추가
                // 클릭 시 cat_cate.html?id=고양이id 로 이동
                const catCard = document.createElement("div")
                catCard.className = "cat-card"
                catCard.innerHTML = `
                <a href="cat_cate.html?id=${cat.id}">
                    <img src="${cat.url}" alt="" class="cat-img">
<h2>${cat.title}</h2>
<p>${cat.description}</p>
                    </a>
                `
                catListDiv.appendChild(catCard)
            })
            pagenation(data.length) // 전체 데이터 수로 페이지네이션 생성
          })
          .catch((error) => {
            console.log(error);
          });
        }
        // 페이지네이션 생성
        function pagenation(totalItems){ // 총 페이지 수 계산
            pagenationDiv.innerHTML = ""
            const totalPage = Math.ceil(totalItems / itemsPerPage)
            for(let i = 1; i <= totalPage; i++){
                const pageLink = document.createElement("a")
                pageLink.href = `?page=${i}` // 어디로 이동하는 쿼리문자열
                pageLink.textContent = i
                if(i === currentPage){
                    pageLink.classList.add("active")
                }
                pageLink.addEventListener("click", (e)=>{
                    e.preventDefault()
                    currentPage = i
                    displayCatInfo(currentPage)
                })
                pagenationDiv.appendChild(pageLink)
            }
            // 이전 버튼
            prevBtn.className = "page-link"
            prevBtn.textContent = "이전"
            pagenationDiv.insertBefore(prevBtn, pagenationDiv.firstChild)
            // 페이지가 1번이면 이전 버튼을 비활성화
            prevBtn.classList.toggle("disabled", currentPage === 1);
            // 이전 버튼 클릭시
           // ✅ 3. 이벤트 중복 방지: 기존 이벤트 제거 후 재등록
        const newPrevBtn = prevBtn.cloneNode(true);
        pagenationDiv.replaceChild(newPrevBtn, prevBtn);
        newPrevBtn.addEventListener("click", () => {
          if (currentPage > 1) {
            currentPage--;
            displayCatInfo(currentPage);
          }
        });
            // 다음 버튼
            nextBtn.className = "page-link"
            nextBtn.textContent = "다음"
            pagenationDiv.appendChild(nextBtn)
            // 마지막 페이지일 때 다음 버튼 비활성화
              nextBtn.classList.toggle("disabled", currentPage === totalPage);
            // ✅ 3. 이벤트 중복 방지 + 4. 다음 버튼 이벤트 추가
        const newNextBtn = nextBtn.cloneNode(true);
        pagenationDiv.replaceChild(newNextBtn, nextBtn);
        newNextBtn.addEventListener("click", () => {
          if (currentPage < totalPage) {
            currentPage++;
            displayCatInfo(currentPage);
          }
        });
        }
      displayCatInfo(currentPage);
    </script>
  </body>
</html>
