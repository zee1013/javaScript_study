<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        ul, li { list-style: none; }
        a { text-decoration: none; color: #333; }
        img { display: block; width: 100%; }

        .menu {
            display: flex;
            width: 70%;
            margin: 100px auto 20px;
            background-color: skyblue;
        }
        .menu-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            background-color: paleturquoise;
            cursor: pointer;
        }
        .menu-item:hover, .menu-item.active {
            background-color: rgb(99, 208, 228);
            color: #fff;
        }

        /* 카드 리스트 기본적으로 숨김 */
        .card {
            display: none;
            width: 70%;
            margin: 0 auto;
            gap: 16px;
        }
        /* active 클래스가 붙은 카드만 표시 */
        .card.active {
            display: flex;
        }
        .card li {
            flex: 1;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="menu">
        <div class="menu-item">menu1</div>
        <div class="menu-item">menu2</div>
        <div class="menu-item">menu3</div>
    </div>
    <div class="card-container"></div>

    <script>
        const menuItems = document.querySelectorAll(".menu-item");
        const cardContainer = document.querySelector(".card-container");

        fetch("cardData.json")
            .then((response) => response.json())
            .then((cardData) => {
                // 카드 리스트 생성
                cardData.forEach((menu) => {
                    const cardList = document.createElement("ul");
                    cardList.classList.add("card");

                    menu.forEach((card) => {
                        const cardItem = document.createElement("li");
                        cardItem.innerHTML = `
                            <img src="${card.imageSrc}" alt="">
                            <h2>${card.description}</h2>
                            <p>${card.price}</p>
                        `;
                        cardList.appendChild(cardItem);
                    });

                    cardContainer.appendChild(cardList);
                });

                // 초기 상태: 첫 번째 메뉴/카드 활성화
                showCard(0);
            })
            .catch((error) => console.log(error));

        // 메뉴 클릭 이벤트
        menuItems.forEach((item, index) => {
            item.addEventListener("click", () => showCard(index));
        });

        // 선택한 index의 카드만 표시
        function showCard(index) {
            const cards = document.querySelectorAll(".card");

            // 모든 메뉴, 카드에서 active 제거
            menuItems.forEach((item) => item.classList.remove("active"));
            cards.forEach((card) => card.classList.remove("active"));

            // 선택한 항목에만 active 추가
            menuItems[index].classList.add("active");
            cards[index].classList.add("active");
        }
    </script>
</body>
</html>
