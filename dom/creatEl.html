<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요소 만들기</title>
</head>
<body>
    <div id="container">
        <h1>웹 프로그래밍</h1>
        <!-- p태그 생성 -->
         <!-- <p>DOM은 document object model의 줄임말이다</p> -->
    </div>
    <div class="notice">
        <!-- js출력 -->
    </div>
    <script>
        // p태그 생성
        const newP = document.createElement("p")
        console.log(newP);
        const txtNode = document.createTextNode("DOM은 document object model의 줄임말이다.")
        console.log(txtNode);
        
        // p태그에 글자를 넣는다.
        newP.appendChild(txtNode)
        // container 영역 안에 p태그 연결
        document.getElementById("container").appendChild(newP)


        const newSpan = document.createElement("span")
        console.log(newSpan);
        const txtHello = document.createTextNode("안녕하세요😚")
        console.log(txtHello);
        newSpan.appendChild(txtHello)
        document.querySelector(".notice").appendChild(newSpan)


    </script>
</body>
</html>
