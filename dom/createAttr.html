<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .item4{
            color: blue;
        }
    </style>
</head>
<body>
    <ul id="list">
        <li>아이템1</li>
        <li>아이템2</li>
        <li>아이템3</li>
        <!-- <li>item4
            <img src="images/cup-1.png" alt="redcup" id="redcup">
        </li> -->
    </ul>
    <button id="addItemBtn">아이템 추가</button>

    <script>
        const addBtn = document.getElementById("addItemBtn")
        const list = document.getElementById("list")
        addBtn.addEventListener("click", ()=>{
            // li 태그 생성
            const newItem = document.createElement("li")
            console.log(newItem);
            newItem.textContent = "아이템4"
            list.appendChild(newItem)
            
            // li 태그에 클래스 명 추가
            newItem.setAttribute("class", "item4")
            // li 태그에 아이디 추가
            newItem.setAttribute("id", "item4")

            // img 태그 만들기
            const newImg = document.createElement("img")
            newImg.setAttribute("src", "images/cup-1.png")
            newImg.setAttribute("alt", "빨간컵")
            newImg.setAttribute("id", "redcup")

            newItem.appendChild(newImg)
        })
    </script>
</body>
</html>
