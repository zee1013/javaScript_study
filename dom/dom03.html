<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dom 이벤트 객체</title>
    <style>
        #cover2{
            border: 10px solid skyblue;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="container">
        <img src="images/easys-1.jpg" alt="이미지" id="cover">
    </div>
    <script>
        const cover = document.querySelector("#cover")
        cover.addEventListener("mouseover", ()=>{
            cover.src = "images/easys-2.jpg"
            cover.id = "cover2"
        })
        cover.addEventListener("mouseout", ()=>{
            cover.src = "images/easys-1.jpg"
            cover.id = "cover"
        })
    </script>
</body>
</html>
