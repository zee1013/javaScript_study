<body>
    <button onclick="goBack()">뒤로가기</button>
    <script>
        function goBack(){
            history.back() // back() : 뒤로가기 매서드
            // history.forward() // forward() : 앞으로가기 매서드
            // history.go(-1) // 뒤로 한 페이지
        }
    </script>
