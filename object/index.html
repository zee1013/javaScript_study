<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체</title>
</head>
<body>
    <script>
        // 자바스크립트 표준 내장 객체
        // 1.string  2.array  3.date  4.math

        // 1. string 
        const str = "hello world"
        console.log(str);
        console.log(str.length); // 문자의 길이를 알 수 있는 속성(property)
        console.log(str.toUpperCase()); // 대문자로 변경하는 매서드(method)
        console.log(str.includes("world")); // 해당하는 내용이 있는지 없는지 확인하는 매서드
        

        // 2. array 배열
        const arr = [1,2,3,4,5]
        console.log(arr);
        console.log(arr.length);
        console.log(arr.push(6));
        console.log(arr); // [1,2,3,4,5,6]
        console.log(arr.join(" / "));
        
        // 3. date
        const today = new Date()
        console.log(today);
        console.log(today.toDateString()); // 현재 날짜
        console.log(today.getFullYear()); // 현재 년도
        console.log(today.getMonth()+1); // 현재 달(0부터 출력하기 때문에 +1을 해줘야 함)
        
        // 4. math
        console.log(Math.PI); // 3.141592.....
        console.log(Math.max(10,23,100));
        console.log(Math.min(10,23,100));
        console.log(Math.random()); // 0~1 사이 난수만 출력
        
        
        
    </script>
</body>
</html>
