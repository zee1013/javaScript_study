<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array 객체</title>
</head>
<body>
    <script>
        const arr = [1,2,3,4]
        console.log(arr);
        
        // 1. length 속성
        console.log(`length : ${arr.length}`);

        // 2. push() : 배열 끝에 요소 추가하는 매서드
        arr.push(5, 6, 7)
        console.log(`push : ${arr}`);
        
        // 3. pop() : 배열 끝 요소를 제거하는 매서드
        arr.pop()
        console.log(`pop : ${arr}`);

        // 4. shift() : 배열 첫 요소를 제거하는 매서드
        arr.shift()
        console.log(`shift : ${arr}`);

        // 5. unshift() : 배열 앞에 요소를 추가하는 매서드
        arr.unshift(8)
        console.log(`unshift : ${arr}`);

        // 6. indexOf() : 요소에 위치를 반환
        console.log(`indexOf : ${arr.indexOf(5)}`);
        console.log(`indexOf : ${arr.indexOf(8)}`);

        // 7. slice() : 배열에 일부만 반환
        // slice(시작 인덱스(포함), 끝 인덱스(미포함, 앞까지 자름))
        console.log(`slice : ${arr.slice(2 , 5)}`);

        // 8. splice() : 배열 요소 추가 및 삭제
        // splice(시작 인덱스(어디서 부터), 삭제 갯수, 추가할 값1, 추가할 값2 ... )
        arr.splice(5, 3, 17,20,22)
        console.log(`splice : ${arr}`);
        
        // 9. join() : 배열을 문자열로 변환
        console.log(`join : ${arr.join("💔")}`);
        
        // 10. forEach() : 각 요소에 대해 함수를 실행
        // 비파괴 매서드
        arr.forEach((item)=>{
            console.log(`forEach : ${item}`);
        })

    </script>
</body>
</html>
